name: Build, test, and deployment demo
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dep-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      - run: dotnet list package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7

  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and start isolated demo
        run: python scripts/start_demo.py
      - name: Check playbook syntax with the Agent runtime
        run: docker compose run --rm --no-deps --entrypoint ansible-playbook -v "${PWD}/playbooks:/playbooks:ro" agent-a --syntax-check -i localhost, /playbooks/minio.yml
      - name: Exercise registration, deployments, idempotence, readiness, and restart
        run: python scripts/smoke_test.py
      - name: Exercise Agent outage, cancellation, recovery, and access rejection
        run: python scripts/failure_scenarios.py
      - name: Exercise rollback and data preservation
        run: python scripts/rollback_test.py
      - name: Verify TLS and host deregistration
        run: python scripts/security_lifecycle_test.py
      - name: Print service diagnostics on failure
        if: failure()
        run: docker compose ps --all && docker compose logs --tail 100
      - name: Stop disposable CI environment
        if: always()
        run: docker compose down --volumes
